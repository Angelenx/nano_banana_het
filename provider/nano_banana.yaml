# 认证配置
credentials_for_provider:
  api_key:
    help:
      en_US: Get your OpenRouter API key from https://openrouter.ai/keys. You need to create an account and generate an API key.
      zh_Hans: 从 OpenRouter 平台获取您的 API Key。您需要创建账户并生成 API 密钥。
    label:
      en_US: OpenRouter API Key
      zh_Hans: OpenRouter API Key
    placeholder:
      en_US: Please input your OpenRouter API Key (sk-or-v1-xxxxxx)
      zh_Hans: 请输入您的 OpenRouter API Key (sk-or-v1-xxxxxx)
    required: true
    type: secret-input
    url: https://openrouter.ai/keys
  proxy_url:
    help:
      en_US: Optional HTTP/HTTPS proxy for accessing OpenRouter API. Leave empty to use direct connection.
      zh_Hans: 访问 OpenRouter API 时使用的 HTTP/HTTPS 代理（可选）。留空则直连。
    label:
      en_US: Proxy URL (optional)
      zh_Hans: 代理地址（可选）
    placeholder:
      en_US: e.g. http://127.0.0.1:7890
      zh_Hans: 例如 http://127.0.0.1:7890
    required: false
    type: text-input

# 扩展配置
extra:
  python:
    source: provider/nano_banana_provider.py

# 身份信息
identity:
  author: wwwzhouhui
  description:
    en_US: OpenRouter AI image generation service integration supporting multiple models (Gemini, Claude)
    zh_Hans: OpenRouter AI 图像生成服务集成，支持多种模型（Gemini、Claude）
  icon: icon.svg
  label:
    en_US: Nano Banana
    zh_Hans: Nano Banana
  name: nano_banana
  tags: [image]

# 工具列表
tools:
- tools/text2image.yaml